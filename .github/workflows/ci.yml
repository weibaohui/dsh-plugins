name: CI

on:
  push:
  pull_request:

jobs:
  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [scheduled-items, hermes-prompt, skills]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: ${{ matrix.plugin }}
      - run: npm run check
        working-directory: ${{ matrix.plugin }}
      - run: npm test
        working-directory: ${{ matrix.plugin }}
